<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema Solar 3D – Mercúrio e Vênus</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#eceff6;--mut:#98a1b5;--card:rgba(10,13,22,.82);--line:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.bot{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);padding:0 12px 12px;display:flex;justify-content:center;pointer-events:none}
.card{pointer-events:auto;position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;max-width:560px;width:100%;backdrop-filter:blur(10px)}
.card h2{margin:0 0 4px;font-size:19px;font-weight:600}
.card p{margin:0 0 10px;color:var(--mut);font-size:13px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.grid div{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.grid b{display:block;font-size:15px;font-weight:500;color:var(--fg);text-transform:none;letter-spacing:0;margin-top:2px}
.x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--mut);font-size:24px;cursor:pointer;line-height:1}
#hint{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13px;color:var(--mut);backdrop-filter:blur(8px)}
.speed{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--mut)}
.speed input{width:90px;vertical-align:middle}
.lbl{position:fixed;left:0;top:0;font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.75);text-shadow:0 0 4px #000;pointer-events:none;white-space:nowrap;display:none}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:var(--mut);font-size:14px;z-index:5}
.go{margin-top:12px;width:100%;padding:11px;border-radius:10px;border:0;background:#e8eefc;color:#0a0f1c;font-size:14px;font-weight:600;cursor:pointer}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .7s;z-index:9}
#wk{display:none}
.hud{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);max-width:min(340px,calc(100vw - 190px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;backdrop-filter:blur(8px)}
.hud b{display:block;font-size:15px;font-weight:600;margin-bottom:2px}.hud span{font-size:12px;color:var(--mut);line-height:1.4}
.exit,#jump{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer;backdrop-filter:blur(8px)}
.exit{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px)}
#keys{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;white-space:nowrap}
#joy{display:none;position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);touch-action:none}
#joy i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35)}
#jump{display:none;position:fixed;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:78px;height:78px;border-radius:50%;padding:0}
.walking .bot,.walking .speed,.walking .lbl{display:none!important}
@media (pointer:coarse){#joy,#jump{display:block}#keys{display:none}}
.card{max-height:48vh;overflow:auto}
.fact{margin:12px 0 0;font-size:12.5px;color:#cfd6e8;background:rgba(255,255,255,.06);border-radius:8px;padding:8px 10px;line-height:1.45}
#hp{margin-top:8px;font-size:11px;color:var(--mut)}
#hp div{height:9px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:4px;overflow:hidden}
#hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5a2a,#ffb02a);transition:width .15s}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,40,0,0) 40%,rgba(255,50,0,.7) 100%);z-index:4;transition:opacity .15s}
#msg{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);max-width:86vw;text-align:center;font-size:20px;font-weight:600;color:#fff;text-shadow:0 2px 14px #000;opacity:0;transition:opacity .35s;pointer-events:none;z-index:5}
#smp{margin-top:6px;font-size:12px;color:#ffd9a0}
#dlg{display:none;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);width:min(420px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;backdrop-filter:blur(10px);z-index:3}
#dlg b{color:#9ff08a;font-size:14px}#dlg span{display:block;margin:4px 0 2px;font-size:14px;line-height:1.4}
@media (pointer:coarse){#dlg{bottom:calc(env(safe-area-inset-bottom,0px) + 170px)}}
#guide{display:none;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);width:min(440px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;backdrop-filter:blur(10px);z-index:3;cursor:pointer}
#gv{float:right;background:none;border:0;font-size:16px;cursor:pointer;color:#fff;padding:0 2px}#guide b{color:#c9a3ff;font-size:14px}#guide span{display:block;margin:4px 0 2px;font-size:14px;line-height:1.4}#guide small{color:var(--mut);font-size:11px}
@media (pointer:coarse){#guide{bottom:calc(env(safe-area-inset-bottom,0px) + 170px)}}
#mwp{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:3}#mwp button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:10px 22px;font-size:14px;cursor:pointer;backdrop-filter:blur(8px)}
#mwp h2{margin:0 0 6px;font-size:18px;font-weight:600}#mwp p{margin:0 0 10px;color:#cfd6e8;font-size:13.5px;line-height:1.5;max-height:26vh;overflow:auto}
#mwp input{width:100%}.mwc{display:flex;gap:8px;margin-top:8px}.mwc button,.mwb{background:rgba(255,255,255,.08);color:var(--fg);border:1px solid var(--line);cursor:pointer;font-size:13px}
.mwc button{flex:1;padding:9px;border-radius:10px}
.mwb{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--card);border-radius:999px;padding:9px 16px;backdrop-filter:blur(8px)}
#mwl{display:none!important;position:fixed;left:0;top:0;font-size:12px;color:#ffe9a8;text-shadow:0 0 4px #000;pointer-events:none;white-space:nowrap;z-index:2}
.mw .bot,.mw .speed,.mw .lbl,.mw .mwb{display:none!important}
.walking .mwb{display:none!important}
#stn{display:none;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 100px);transform:translateX(-50%);width:min(460px,calc(100vw - 24px));text-align:center;background:var(--card);border:3px solid #ffd23a;border-radius:24px;padding:16px 20px 18px;backdrop-filter:blur(10px);z-index:6;animation:stnpop .35s ease-out}
@keyframes stnpop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#stne{font-size:46px;line-height:1.1}#stn b{display:block;font-size:24px;color:#ffe27a;margin:4px 0 8px}#stnx{display:block;font-size:17px;line-height:1.5;color:#e6ecff}
#stnb{margin-top:14px;padding:12px 30px;border-radius:999px;border:0;background:#ffd23a;color:#2a1a00;font-size:19px;font-weight:700;cursor:pointer}
#stnv{position:absolute;right:12px;top:10px;background:none;border:0;font-size:22px;cursor:pointer;color:#fff}
#cinb{top:112px}.cinon .bot,.cinon .speed,.cinon .mwb,.cinon .lbl,.walking #cinb,.mw #cinb{display:none!important}
#cb1,#cb2{position:fixed;left:0;right:0;height:0;background:#000;z-index:6;transition:height 1.2s;pointer-events:none}#cb1{top:0}#cb2{bottom:0}.cinon #cb1,.cinon #cb2{height:9vh}
#cin{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(9vh + 14px);width:min(620px,calc(100vw - 24px));z-index:7;text-align:center;color:#fff;text-shadow:0 2px 12px #000}
#cin h2{margin:0 0 4px;font-size:22px;font-weight:600}#cin p{margin:0;font-size:15px;line-height:1.5;color:#eef2ff}#cinc{margin-top:8px;font:600 14px ui-monospace,monospace;color:#ffd98a}
#cinx{position:fixed;right:12px;top:calc(9vh + 10px);z-index:8;display:none}
#vg{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity 1.2s;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}.cinon #vg{opacity:1}
#cinbar{position:fixed;left:0;bottom:0;height:3px;width:0;background:#ffd98a;z-index:7;display:none}.cinon #cinbar{display:block}.cinon canvas{pointer-events:none!important}
@keyframes cintin{from{opacity:0;transform:translateY(14px);letter-spacing:.3em}to{opacity:1;transform:none;letter-spacing:0}}
#mwp{width:min(640px,calc(100vw - 24px));text-align:center;color:#fff;text-shadow:0 2px 12px #000}.mw #mwp{bottom:calc(9vh + 12px)}#mwt{font-size:24px!important}
#mwbar{height:3px;background:rgba(255,255,255,.15);border-radius:2px;margin:6px 0 4px}#mwbar i{display:block;height:100%;width:0;background:#9fc4ff;border-radius:2px}
.mw #cb1,.mw #cb2{height:9vh}.mw #vg{opacity:1}.mw canvas{pointer-events:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">Gerando o Sistema Solar…</div>
<div class="lbl" id="l-mercurio">Mercúrio</div><div class="lbl" id="l-venus">Vênus</div>
<div class="speed">Velocidade <input id="spd" type="range" min="0" max="5" step="0.1" value="1"></div>
<div class="bot"><div id="hint">Toque em Mercúrio ou Vênus para ver as informações</div><div class="card" id="info" style="display:none"></div></div>

<button class="mwb" id="mwb">🌌 Viagem à Via Láctea</button><div id="mwl">☀ Sistema Solar · você está aqui</div>
<div id="mwp"><h2 id="mwt"></h2><p id="mwx"></p><div id="mwbar"><i></i></div><div class="mwc"><button id="mwv">🔊 Voz</button><button id="mwe">✕ Sair</button></div></div>
<div id="fade"></div><button class="mwb" id="cinb">☀ Viagem da Luz</button><div id="cb1"></div><div id="cb2"></div><div id="vg"></div><div id="cinbar"></div><div id="cin"><h2 id="cint"></h2><p id="cinp"></p><div id="cinc"></div></div><button class="exit" id="cinx">✕ Sair</button>
<div id="wk"><div class="hud" id="wkhud"></div><button class="exit" onclick="exitSurface()">← Voltar ao espaço</button><div id="keys">WASD / setas: andar · Espaço: pular · arraste: girar a câmera</div><div id="dlg"><b>Xristian</b><span id="dlgt"></span><button id="dlgb" class="go">🍲 Pedir polenta (E)</button></div><div id="guide"><b>👽 Zorp · seu guia</b><button id="gv" title="Voz do Zorp">🔊</button><span id="gt"></span><small>toque aqui para o próximo fato</small></div><div id="stn"><button id="stnv" title="Voz">🔊</button><div id="stne"></div><b id="stnt"></b><span id="stnx"></span><button id="stnb">Continuar</button></div><div id="hurt"></div><div id="msg"></div><div id="joy"><i></i></div><button id="jump">Pular</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA={
 mercurio:{n:"Mercúrio",d:"O menor planeta do Sistema Solar e o mais próximo do Sol. Superfície cravejada de crateras e atmosfera quase inexistente.",s:[["Massa","3,30 × 10²³ kg"],["Tipo","Rochoso (terrestre)"],["Luas","0"],["Diâmetro","4.879 km"],["Ano","88 dias terrestres"],["Distância ao Sol","57,9 milhões km"]]},
 venus:{n:"Vênus",d:"O planeta mais quente do Sistema Solar, com densa atmosfera de CO₂ e nuvens de ácido sulfúrico. Gira em sentido contrário ao da maioria dos planetas.",s:[["Massa","4,87 × 10²⁴ kg"],["Tipo","Rochoso (terrestre)"],["Luas","0"],["Diâmetro","12.104 km"],["Ano","224,7 dias terrestres"],["Distância ao Sol","108,2 milhões km"]]}
};
const EXTRA={
 mercurio:{s:[["Gravidade","3,7 m/s²"],["Temperatura","−180 a 430 °C"],["Raio","2.440 km"],["Densidade","5,43 g/cm³"],["Rotação","58,6 dias terrestres"],["Dia solar","176 dias terrestres"],["Inclinação do eixo","0,03°"],["Velocidade orbital","47,4 km/s"],["Atmosfera","Quase nenhuma (exosfera)"],["Descoberta","Conhecido desde a Antiguidade"]],f:"Em Mercúrio, o intervalo entre dois nasceres do Sol dura 176 dias terrestres, o dobro do seu próprio ano de 88 dias."},
 venus:{s:[["Gravidade","8,9 m/s²"],["Temperatura","465 °C (média)"],["Raio","6.052 km"],["Densidade","5,24 g/cm³"],["Rotação","243 dias (retrógrada)"],["Dia solar","117 dias terrestres"],["Inclinação do eixo","177,4°"],["Velocidade orbital","35 km/s"],["Atmosfera","96,5% CO₂ · 92× a pressão da Terra"],["Descoberta","Conhecido desde a Antiguidade"]],f:"Um dia em Vênus (243 dias) dura mais que o seu ano (224,7 dias), e lá o Sol nasce no oeste."}};
const info=document.getElementById('info'),hint=document.getElementById('hint');
function show(k){const d=DATA[k];hint.style.display=d?'none':'block';info.style.display=d?'block':'none';
 if(d)info.innerHTML=`<button class="x" onclick="setFocus('sol')" aria-label="Fechar">×</button><h2>${d.n}</h2><p>${d.d}</p><div class="grid">${d.s.concat((EXTRA[k]||{s:[]}).s).map(x=>`<div>${x[0]}<b>${x[1]}</b></div>`).join('')}</div><p class="fact">💡 ${(EXTRA[k]||{f:''}).f}</p><button class="go" onclick="enterSurface('${k}')">🚀 Pousar na superfície</button>`}

// ---------- ruído 3D (sem emendas nas esferas) ----------
function h3(x,y,z){const s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return s-Math.floor(s)}
function vn3(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
 const L=(a,b,t)=>a+(b-a)*t;
 return L(L(L(h3(xi,yi,zi),h3(xi+1,yi,zi),u),L(h3(xi,yi+1,zi),h3(xi+1,yi+1,zi),u),v),L(L(h3(xi,yi,zi+1),h3(xi+1,yi,zi+1),u),L(h3(xi,yi+1,zi+1),h3(xi+1,yi+1,zi+1),u),v),w)}
function fbm(x,y,z,o=5){let a=.5,s=0;for(let i=0;i<o;i++){s+=a*vn3(x,y,z);x*=2.03;y*=2.03;z*=2.03;a/=2}return s}
const mix=(a,b,t)=>{t=Math.min(1,Math.max(0,t));return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]};
function sph(W,H,fn,after){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),im=g.createImageData(W,H);
 for(let y=0;y<H;y++){const lat=(.5-y/H)*Math.PI,cl=Math.cos(lat),sl=Math.sin(lat);
  for(let x=0;x<W;x++){const lon=x/W*6.2832,r=fn(cl*Math.cos(lon),sl,cl*Math.sin(lon),lat,lon),i=(y*W+x)*4;
   im.data[i]=r[0];im.data[i+1]=r[1];im.data[i+2]=r[2];im.data[i+3]=r[3]===undefined?255:r[3]}}
 g.putImageData(im,0,0);if(after)after(g,W,H);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
const bandTex=(W,H,c1,c2,nb,wp,ds,extra)=>sph(W,H,(x,y,z,lat,lon)=>{const w=fbm(x*3,y*3,z*3,4)*wp,t=.5+.5*Math.sin(lat*nb+w*3),d=fbm(x*ds,y*ds*4,z*ds,4)-.5;
 let c=mix(c1,c2,t+d*.5);return extra?extra(c,lat,lon,x,y,z):c});

const mercTex=sph(1024,512,(x,y,z)=>{const v=80+fbm(x*3,y*3,z*3,5)*110+(fbm(x*22,y*22,z*22,3)-.5)*40;return[v*1.03,v*.98,v*.92]},(g,W,H)=>{
 for(let i=0;i<260;i++){const x=Math.random()*W,y=H*.08+Math.random()*H*.84,r=2+Math.pow(Math.random(),3.2)*26,sx=1/Math.max(.25,Math.cos((.5-y/H)*Math.PI));
  g.save();g.translate(x,y);g.scale(sx,1);const gr=g.createRadialGradient(0,0,r*.1,0,0,r);
  gr.addColorStop(0,'rgba(25,24,22,.5)');gr.addColorStop(.82,'rgba(30,28,26,.22)');gr.addColorStop(.93,'rgba(205,198,188,.5)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.restore()}});
const venTex=sph(1024,512,(x,y,z)=>{const w=fbm(x*2,y*2,z*2,3),n=fbm(x*2.2+w*1.6,y*5+w*1.2,z*2.2+w*1.6,5);return mix([212,172,102],[246,228,178],(n-.3)*2.4)});
const earthTex=sph(1024,512,(x,y,z,lat)=>{const n=fbm(x*1.8+3,y*1.8,z*1.8,6),a=Math.abs(lat),land=n>.5;let c;
 if(land){const dz=fbm(x*3+9,y*3,z*3,4),des=dz>.5&&a<.7?1:0;c=mix(mix([52,98,46],[34,70,34],fbm(x*8,y*8,z*8,3)*1.5),[196,168,112],des*(dz-.48)*6);c=mix(c,[110,100,80],Math.max(0,n-.62)*5)}
 else c=mix([6,26,72],[26,78,140],(n-.25)*3.2);
 return mix(c,[240,245,250],(a-1.18)*6)});
const cloudTex=sph(1024,512,(x,y,z)=>{const w=fbm(x*2,y*2,z*2,3),n=fbm(x*3.5+w*2,y*5+w,z*3.5+w*2,5);return[255,255,255,Math.min(1,Math.max(0,(n-.5)*4))*215]});
const marsTex=sph(512,256,(x,y,z,lat)=>{let c=mix([152,76,46],[208,128,82],fbm(x*3,y*3,z*3,5));c=mix(c,[96,58,42],(fbm(x*1.6+5,y*1.6,z*1.6,4)-.52)*5);return mix(c,[238,238,240],(Math.abs(lat)-1.38)*14)});
const jupTex=bandTex(1024,512,[226,206,172],[160,106,72],13,1.2,5,(c,lat,lon)=>{let dx=lon-3.6;dx=Math.atan2(Math.sin(dx),Math.cos(dx))*Math.cos(lat);const dy=lat+.4,g=Math.exp(-((dx/.2)**2+(dy/.1)**2));return mix(c,[186,84,54],g*1.2)});
const satTex=bandTex(512,256,[234,216,172],[200,176,128],10,.8,4);
const uraTex=bandTex(512,256,[150,214,224],[174,230,236],6,.3,3);
const nepTex=bandTex(512,256,[42,74,184],[72,112,224],8,.6,4,(c,lat,lon,x,y,z)=>mix(c,[200,220,255],(fbm(x*5,y*14,z*5,4)-.62)*5));
const sunTex=sph(512,256,(x,y,z)=>{const g=fbm(x*9,y*9,z*9,4),b=fbm(x*3,y*3,z*3,3);return mix([255,140,30],[255,238,170],g*1.5+b*.4-.3)});
const ringTex=(()=>{const c=document.createElement('canvas');c.width=512;c.height=4;const g=c.getContext('2d');
 for(let x=0;x<512;x++){const t=x/512;let a=0;
  if(t<.1)a=.12;else if(t<.45)a=.85;else if(t<.5)a=.04;else if(t<.86)a=.6;
  if(t>.78&&t<.79)a=.05;a*=.75+.25*Math.sin(x*1.7)*Math.sin(x*.37+1);
  const v=170+Math.sin(x*.9)*25;g.fillStyle=`rgba(${v+30|0},${v+8|0},${v-40|0},${Math.max(0,a)})`;g.fillRect(x,0,1,4)}
 return new THREE.CanvasTexture(c)})();
