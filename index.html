{n:'Mercúrio',r:3.8,d:65,s:.04,t:0,sp:.0014,col:'#b5b5b5',g:3.7,tp:'167 °C média (−180 a 430)',pr:'≈ 0 (vácuo)',type:'Planeta rochoso',dist:'0,39 UA · 58 mi km',diam:'4.880 km',per:'88 dias',day:'176 dias',mc:0,ml:[],rock:1,desc:'O menor planeta e o mais próximo do Sol. Superfície coberta de crateras, sem atmosfera para reter calor.',body:'Sem ar, você perde a consciência em cerca de 15 segundos. Sem filtro de atmosfera, o lado diurno queima e o noturno congela. Com 38% da gravidade da Terra, ossos e músculos enfraquecem com o tempo.',gen:()=>mk(512,256,rock([90,85,80],[185,178,168]))},

{n:'Terra',r:7.2,d:140,s:.01,t:.41,sp:.008,col:'#2a6aff',g:9.81,tp:'15 °C',pr:'1 bar',type:'Planeta rochoso',dist:'1 UA · 149,6 mi km',diam:'12.742 km',per:'365,25 dias',day:'23 h 56 min',mc:1,ml:[['Lua',3.6,1.9,.012,'#bbb']],mn:'Lua',atm:['#5aa9ff',3,.06],sky:[.3,.55,1],cloud:1,desc:'Único mundo conhecido com vida. Tem água líquida na superfície, atmosfera respirável e um campo magnético que desvia a radiação solar.',body:'Aqui o seu corpo está em casa: pressão, 21% de oxigênio e temperatura amenos. A gravidade de 1 g mantém ossos, músculos e circulação ajustados.',gen:()=>mk(1024,512,earth)},

{n:'Júpiter',r:20,d:290,s:.004,t:.05,sp:.02,col:'#d8a05e',g:24.79,tp:'−108 °C (topo das nuvens)',pr:'1 bar no topo',type:'Gigante gasoso',dist:'5,2 UA · 778 mi km',diam:'139.820 km',per:'11,9 anos',day:'9 h 56 min',mc:97,ml:[['Io',1.9,1.3,.04,'#e8d27a'],['Europa',2.4,1.1,.03,'#d8cfc0'],['Ganimedes',3,1.9,.02,'#a89c8c'],['Calisto',3.7,1.7,.014,'#6e655c']],mn:'Io, Europa, Ganimedes, Calisto e mais 93',atm:['#e8b87a',5,.02],desc:'O maior planeta: caberiam mais de 1.300 Terras dentro dele. A Grande Mancha Vermelha é uma tempestade com séculos de idade.',body:'Não há chão: esta plataforma é imaginária, no topo das nuvens. Com 2,5 g, o sangue se acumula nos pés, o coração sofre e você desmaia facilmente. O ar é hidrogênio e hélio (sufoca), a radiação é letal e, ao descer, a pressão esmaga qualquer estrutura.',gen:()=>mk(1024,512,gas([120,80,50],[236,214,178],14,la(-.35,2.6)))},

/* Carrega GLB e normaliza escala/posição */
function loadGLB(url,name){
  return new Promise((resolve)=>{
    const loader=new THREE.GLTFLoader();
    loader.load(url,(gltf)=>{
      const root=gltf.scene;
      // centraliza e normaliza
      const box=new THREE.Box3().setFromObject(root);
      const size=box.getSize(new THREE.Vector3());
      const maxDim=Math.max(size.x,size.y,size.z)||1;
      const scale=1.8/maxDim; // altura aproximada ~1.8 unidades
      root.scale.setScalar(scale);
      box.setFromObject(root);
      const center=box.getCenter(new THREE.Vector3());
      root.position.sub(center); // centro no origin
      root.position.y-=box.min.y*scale; // pés no chão
      root.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;if(c.material){c.material.side=THREE.FrontSide}}});
      console.log(name+' carregado com sucesso');
      resolve(root);
    },undefined,(err)=>{
      console.warn('Falha ao carregar '+name+' de '+url+' — usando personagem procedural.',err);
      resolve(null);
    });
  });
}

function cloneModel(src,fallbackColor1,fallbackColor2){
  if(src){

    c.traverse(o=>{if(o.isMesh&&o.material){o.material=o.material.clone()}});

}
