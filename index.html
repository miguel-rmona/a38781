<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema Solar 3D – Mercúrio e Vênus</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#eceff6;--mut:#98a1b5;--card:rgba(10,13,22,.82);--line:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.bot{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);padding:0 12px 12px;display:flex;justify-content:center;pointer-events:none}
.card{pointer-events:auto;position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;max-width:560px;width:100%;backdrop-filter:blur(10px)}
.card h2{margin:0 0 4px;font-size:19px;font-weight:600}
.card p{margin:0 0 10px;color:var(--mut);font-size:13px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.grid div{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.grid b{display:block;font-size:15px;font-weight:500;color:var(--fg);text-transform:none;letter-spacing:0;margin-top:2px}
.x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--mut);font-size:24px;cursor:pointer;line-height:1}
#hint{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-size:13px;color:var(--mut);backdrop-filter:blur(8px)}
.speed{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--mut)}
.speed input{width:90px;vertical-align:middle}
.lbl{position:fixed;left:0;top:0;font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.75);text-shadow:0 0 4px #000;pointer-events:none;white-space:nowrap;display:none}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:var(--mut);font-size:14px;z-index:5}
.go{margin-top:12px;width:100%;padding:11px;border-radius:10px;border:0;background:#e8eefc;color:#0a0f1c;font-size:14px;font-weight:600;cursor:pointer}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .7s;z-index:9}
#wk{display:none}
.hud{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);max-width:min(340px,calc(100vw - 190px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;backdrop-filter:blur(8px)}
.hud b{display:block;font-size:15px;font-weight:600;margin-bottom:2px}.hud span{font-size:12px;color:var(--mut);line-height:1.4}
.exit,#jump{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer;backdrop-filter:blur(8px)}
.exit{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px)}
#keys{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;white-space:nowrap}
#joy{display:none;position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--line);touch-action:none}
#joy i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35)}
#jump{display:none;position:fixed;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:78px;height:78px;border-radius:50%;padding:0}
.walking .bot,.walking .speed,.walking .lbl{display:none!important}
@media (pointer:coarse){#joy,#jump{display:block}#keys{display:none}}
.card{max-height:48vh;overflow:auto}
.fact{margin:12px 0 0;font-size:12.5px;color:#cfd6e8;background:rgba(255,255,255,.06);border-radius:8px;padding:8px 10px;line-height:1.45}
#hp{margin-top:8px;font-size:11px;color:var(--mut)}
#hp div{height:9px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:4px;overflow:hidden}
#hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5a2a,#ffb02a);transition:width .15s}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,40,0,0) 40%,rgba(255,50,0,.7) 100%);z-index:4;transition:opacity .15s}
#msg{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);max-width:86vw;text-align:center;font-size:20px;font-weight:600;color:#fff;text-shadow:0 2px 14px #000;opacity:0;transition:opacity .35s;pointer-events:none;z-index:5}
#smp{margin-top:6px;font-size:12px;color:#ffd9a0}
#dlg{display:none;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);width:min(420px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;backdrop-filter:blur(10px);z-index:3}
#dlg b{color:#9ff08a;font-size:14px}#dlg span{display:block;margin:4px 0 2px;font-size:14px;line-height:1.4}
@media (pointer:coarse){#dlg{bottom:calc(env(safe-area-inset-bottom,0px) + 170px)}}
#guide{display:none;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);width:min(440px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;backdrop-filter:blur(10px);z-index:3;cursor:pointer}
#gv{float:right;background:none;border:0;font-size:16px;cursor:pointer;color:#fff;padding:0 2px}#guide b{color:#c9a3ff;font-size:14px}#guide span{display:block;margin:4px 0 2px;font-size:14px;line-height:1.4}#guide small{color:var(--mut);font-size:11px}
@media (pointer:coarse){#guide{bottom:calc(env(safe-area-inset-bottom,0px) + 170px)}}
#mwp{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(600px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;backdrop-filter:blur(10px);z-index:3}
#mwp h2{margin:0 0 6px;font-size:18px;font-weight:600}#mwp p{margin:0 0 10px;color:#cfd6e8;font-size:13.5px;line-height:1.5;max-height:26vh;overflow:auto}
#mwp input{width:100%}.mwc{display:flex;gap:8px;margin-top:8px}.mwc button,.mwb{background:rgba(255,255,255,.08);color:var(--fg);border:1px solid var(--line);cursor:pointer;font-size:13px}
.mwc button{flex:1;padding:9px;border-radius:10px}
.mwb{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);background:var(--card);border-radius:999px;padding:9px 16px;backdrop-filter:blur(8px)}
#mwl{display:none;position:fixed;left:0;top:0;font-size:12px;color:#ffe9a8;text-shadow:0 0 4px #000;pointer-events:none;white-space:nowrap;z-index:2}
.mw .bot,.mw .speed,.mw .lbl,.mw .mwb{display:none!important}
.walking .mwb{display:none!important}
#stn{display:none;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 100px);transform:translateX(-50%);width:min(460px,calc(100vw - 24px));text-align:center;background:var(--card);border:3px solid #ffd23a;border-radius:24px;padding:16px 20px 18px;backdrop-filter:blur(10px);z-index:6;animation:stnpop .35s ease-out}
@keyframes stnpop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
#stne{font-size:72px;line-height:1.1}#stn b{display:block;font-size:28px;color:#ffe27a;margin:4px 0 8px}#stnx{display:block;font-size:20px;line-height:1.4;color:#fff}
#stnb{margin-top:14px;padding:12px 30px;border-radius:999px;border:0;background:#ffd23a;color:#2a1a00;font-size:19px;font-weight:700;cursor:pointer}
#stnv{position:absolute;right:12px;top:10px;background:none;border:0;font-size:22px;cursor:pointer;color:#fff}
#vs{display:none;position:fixed;inset:0;pointer-events:none;z-index:4;color:#fff}
.vsh{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);padding:6px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);font-size:13px;line-height:1.35}
.vsh.p1{left:10px}.vsh.p2{left:calc(50% + 10px)}.vsh b{display:block;font-size:15px}.vsh .st{font-size:20px;font-weight:700;color:#ffe27a}.vsh small{display:block;color:var(--mut);font-size:11px}
.vsh .hpv{display:none;height:8px;border-radius:5px;background:rgba(255,255,255,.15);margin-top:4px;overflow:hidden}.vsh .hpv i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5a2a,#ffb02a)}
#vsdiv{position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:linear-gradient(#ffffffcc,#ffffff55);box-shadow:0 0 8px #000}
#vst{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);padding:6px 16px;background:rgba(0,0,0,.65);border:2px solid #ffd23a;border-radius:999px;font-weight:700;font-size:20px}
#vsmid{display:none;position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:min(12vw,96px);font-weight:800;text-align:center;text-shadow:0 4px 18px #000;max-width:94vw;line-height:1.15}
.vsc{display:none;position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:calc(50% - 28px);text-align:center;background:var(--card);border:3px solid #ffd23a;border-radius:20px;padding:10px 14px;backdrop-filter:blur(10px)}
.vsc.p1{left:14px}.vsc.p2{left:calc(50% + 14px)}.vsc .e{font-size:44px;line-height:1.1}.vsc b{display:block;font-size:20px;color:#ffe27a}.vsc span{display:block;font-size:15px;line-height:1.35}
#vsend{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 24px));text-align:center;background:var(--card);border:3px solid #ffd23a;border-radius:24px;padding:22px;pointer-events:auto;backdrop-filter:blur(12px)}
#vsend h2{font-size:30px;margin-bottom:8px}#vsend p{font-size:18px;margin-bottom:14px}
#vsend button{pointer-events:auto;padding:10px 22px;border-radius:999px;border:0;background:#ffd23a;color:#2a1a00;font-weight:700;font-size:16px;cursor:pointer;margin:0 6px}
#vsx{pointer-events:auto;position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);background:var(--card);color:#fff;border:1px solid var(--line);border-radius:999px;font-size:13px;padding:8px 14px;cursor:pointer}
#vsp{display:none;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:var(--card);border:2px solid #ffd23a;border-radius:16px;padding:10px 16px;backdrop-filter:blur(10px);z-index:5;font-size:14px;text-align:center}
#vsp button{margin-left:10px;padding:8px 16px;border-radius:999px;border:0;background:#ffd23a;color:#2a1a00;font-weight:700;cursor:pointer}
.walking #vsp,.mw #vsp{display:none!important}
@media (orientation:portrait){#vsdiv{left:0;right:0;top:50%;bottom:auto;width:auto;height:4px;margin:-2px 0 0}.vsh.p2{left:10px;top:calc(50% + 8px)}.vsc{width:calc(100% - 28px)}.vsc.p1{left:14px;bottom:calc(50% + 14px)}.vsc.p2{left:14px}#vst{top:calc(50% - 18px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">Gerando o Sistema Solar…</div>
<div class="lbl" id="l-mercurio">Mercúrio</div><div class="lbl" id="l-venus">Vênus</div>
<div class="speed">Velocidade <input id="spd" type="range" min="0" max="5" step="0.1" value="1"></div>
<div class="bot"><div id="hint">Toque em Mercúrio ou Vênus para ver as informações</div><div class="card" id="info" style="display:none"></div></div>

<button class="mwb" id="mwb">🌌 Viagem à Via Láctea</button><div id="mwl">☀ Sistema Solar · você está aqui</div>
<div id="mwp"><h2 id="mwt"></h2><p id="mwx"></p><input id="mws" type="range" min="0" max="1000" value="0"><div class="mwc"><button id="mwpl">Pausar</button><button id="mwv">🔊 Voz</button><button id="mwe">✕ Sair</button></div></div>
<button class="mwb" id="vsb" style="top:calc(env(safe-area-inset-top,0px) + 108px)">🎮 Gincana: Solo · 2 · Online</button>
<div id="vsp">🎮 2 controles detectados! <button id="vsp2">Jogar em dupla</button></div>
<div id="vs"><div class="vsh p1" id="vsh0"><b></b><span class="st"></span><small></small><div class="hpv"><i></i></div></div><div class="vsh p2" id="vsh1"><b></b><span class="st"></span><small></small><div class="hpv"><i></i></div></div>
<div id="vsdiv"></div><div id="vst"></div><div id="vsmid"></div>
<div class="vsc p1" id="vsc0"><div class="e"></div><b></b><span></span></div><div class="vsc p2" id="vsc1"><div class="e"></div><b></b><span></span></div>
<div id="vsend"><h2></h2><p></p><div><button id="vsr">Jogar de novo</button><button id="vsq">Sair</button></div></div><button id="vsx">✕ Sair</button></div>
<div id="fade"></div>
<div id="wk"><div class="hud" id="wkhud"></div><button class="exit" onclick="exitSurface()">← Voltar ao espaço</button><div id="keys">WASD / setas: andar · Espaço: pular · arraste: girar a câmera</div><div id="dlg"><b>Xristian</b><span id="dlgt"></span><button id="dlgb" class="go">🍲 Pedir polenta (E)</button></div><div id="guide"><b>👽 Zorp · seu guia</b><button id="gv" title="Voz do Zorp">🔊</button><span id="gt"></span><small>toque aqui para o próximo fato</small></div><div id="stn"><button id="stnv" title="Voz">🔊</button><div id="stne"></div><b id="stnt"></b><span id="stnx"></span><button id="stnb">⭐ Entendi!</button></div><div id="hurt"></div><div id="msg"></div><div id="joy"><i></i></div><button id="jump">Pular</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DATA={
 mercurio:{n:"Mercúrio",d:"O menor planeta do Sistema Solar e o mais próximo do Sol. Superfície cravejada de crateras e atmosfera quase inexistente.",s:[["Massa","3,30 × 10²³ kg"],["Tipo","Rochoso (terrestre)"],["Luas","0"],["Diâmetro","4.879 km"],["Ano","88 dias terrestres"],["Distância ao Sol","57,9 milhões km"]]},
 venus:{n:"Vênus",d:"O planeta mais quente do Sistema Solar, com densa atmosfera de CO₂ e nuvens de ácido sulfúrico. Gira em sentido contrário ao da maioria dos planetas.",s:[["Massa","4,87 × 10²⁴ kg"],["Tipo","Rochoso (terrestre)"],["Luas","0"],["Diâmetro","12.104 km"],["Ano","224,7 dias terrestres"],["Distância ao Sol","108,2 milhões km"]]}
};
const EXTRA={
 mercurio:{s:[["Gravidade","3,7 m/s²"],["Temperatura","−180 a 430 °C"],["Raio","2.440 km"],["Densidade","5,43 g/cm³"],["Rotação","58,6 dias terrestres"],["Dia solar","176 dias terrestres"],["Inclinação do eixo","0,03°"],["Velocidade orbital","47,4 km/s"],["Atmosfera","Quase nenhuma (exosfera)"],["Descoberta","Conhecido desde a Antiguidade"]],f:"Em Mercúrio, o intervalo entre dois nasceres do Sol dura 176 dias terrestres, o dobro do seu próprio ano de 88 dias."},
 venus:{s:[["Gravidade","8,9 m/s²"],["Temperatura","465 °C (média)"],["Raio","6.052 km"],["Densidade","5,24 g/cm³"],["Rotação","243 dias (retrógrada)"],["Dia solar","117 dias terrestres"],["Inclinação do eixo","177,4°"],["Velocidade orbital","35 km/s"],["Atmosfera","96,5% CO₂ · 92× a pressão da Terra"],["Descoberta","Conhecido desde a Antiguidade"]],f:"Um dia em Vênus (243 dias) dura mais que o seu ano (224,7 dias), e lá o Sol nasce no oeste."}};
const info=document.getElementById('info'),hint=document.getElementById('hint');
function show(k){const d=DATA[k];hint.style.display=d?'none':'block';info.style.display=d?'block':'none';
 if(d)info.innerHTML=`<button class="x" onclick="setFocus('sol')" aria-label="Fechar">×</button><h2>${d.n}</h2><p>${d.d}</p><div class="grid">${d.s.concat((EXTRA[k]||{s:[]}).s).map(x=>`<div>${x[0]}<b>${x[1]}</b></div>`).join('')}</div><p class="fact">💡 ${(EXTRA[k]||{f:''}).f}</p><button class="go" onclick="enterSurface('${k}')">🚀 Pousar na superfície</button>`}

// ---------- ruído 3D (sem emendas nas esferas) ----------
function h3(x,y,z){const s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return s-Math.floor(s)}
function vn3(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
 const L=(a,b,t)=>a+(b-a)*t;
 return L(L(L(h3(xi,yi,zi),h3(xi+1,yi,zi),u),L(h3(xi,yi+1,zi),h3(xi+1,yi+1,zi),u),v),L(L(h3(xi,yi,zi+1),h3(xi+1,yi,zi+1),u),L(h3(xi,yi+1,zi+1),h3(xi+1,yi+1,zi+1),u),v),w)}
function fbm(x,y,z,o=5){let a=.5,s=0;for(let i=0;i<o;i++){s+=a*vn3(x,y,z);x*=2.03;y*=2.03;z*=2.03;a/=2}return s}
const mix=(a,b,t)=>{t=Math.min(1,Math.max(0,t));return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]};
function sph(W,H,fn,after){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),im=g.createImageData(W,H);
 for(let y=0;y<H;y++){const lat=(.5-y/H)*Math.PI,cl=Math.cos(lat),sl=Math.sin(lat);
  for(let x=0;x<W;x++){const lon=x/W*6.2832,r=fn(cl*Math.cos(lon),sl,cl*Math.sin(lon),lat,lon),i=(y*W+x)*4;
   im.data[i]=r[0];im.data[i+1]=r[1];im.data[i+2]=r[2];im.data[i+3]=r[3]===undefined?255:r[3]}}
 g.putImageData(im,0,0);if(after)after(g,W,H);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
const bandTex=(W,H,c1,c2,nb,wp,ds,extra)=>sph(W,H,(x,y,z,lat,lon)=>{const w=fbm(x*3,y*3,z*3,4)*wp,t=.5+.5*Math.sin(lat*nb+w*3),d=fbm(x*ds,y*ds*4,z*ds,4)-.5;
 let c=mix(c1,c2,t+d*.5);return extra?extra(c,lat,lon,x,y,z):c});

const mercTex=sph(1024,512,(x,y,z)=>{const v=80+fbm(x*3,y*3,z*3,5)*110+(fbm(x*22,y*22,z*22,3)-.5)*40;return[v*1.03,v*.98,v*.92]},(g,W,H)=>{
 for(let i=0;i<260;i++){const x=Math.random()*W,y=H*.08+Math.random()*H*.84,r=2+Math.pow(Math.random(),3.2)*26,sx=1/Math.max(.25,Math.cos((.5-y/H)*Math.PI));
  g.save();g.translate(x,y);g.scale(sx,1);const gr=g.createRadialGradient(0,0,r*.1,0,0,r);
  gr.addColorStop(0,'rgba(25,24,22,.5)');gr.addColorStop(.82,'rgba(30,28,26,.22)');gr.addColorStop(.93,'rgba(205,198,188,.5)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.restore()}});
const venTex=sph(1024,512,(x,y,z)=>{const w=fbm(x*2,y*2,z*2,3),n=fbm(x*2.2+w*1.6,y*5+w*1.2,z*2.2+w*1.6,5);return mix([212,172,102],[246,228,178],(n-.3)*2.4)});
const earthTex=sph(1024,512,(x,y,z,lat)=>{const n=fbm(x*1.8+3,y*1.8,z*1.8,6),a=Math.abs(lat),land=n>.5;let c;
 if(land){const dz=fbm(x*3+9,y*3,z*3,4),des=dz>.5&&a<.7?1:0;c=mix(mix([52,98,46],[34,70,34],fbm(x*8,y*8,z*8,3)*1.5),[196,168,112],des*(dz-.48)*6);c=mix(c,[110,100,80],Math.max(0,n-.62)*5)}

   else menu('net','✅ Servidor criado!<br>Seu IP: <b>'+ips+'</b><br>Seu amigo abre <b>http://'+(m.ips[0]||'')+':'+m.port+'</b> e toca em “Entrar”.<br>Aguardando o amigo…')}

// ---------- viagem até a Via Láctea ----------
const sS=(u,a,b)=>{const t=Math.min(1,Math.max(0,(u-a)/(b-a)));return t*t*(3-2*t)};
const GC=new THREE.Vector3(-2.6e4,0,0),LG=new THREE.Vector3(2e5,0,-5e4);
const MW={on:false,u:0,play:true,voice:true,b:1,t:0,built:false,spk:false,si:-1,sid:0};
const MWS=[
[0,"Sistema Solar","Olha só… a gente começa bem aqui, no nosso quintal cósmico. Oito planetas, um planeta anão e um monte de rochas e gelo girando em volta do Sol. A luz que sai daquela bola de fogo demora oito minutos e vinte segundos só pra chegar na Terra. É o começo de tudo que a gente conhece."],
[.08,"Nuvem de Oort","Agora a gente sai do sistema e entra na Nuvem de Oort. Imagine uma casca gigante, cheia de bilhões de cometas, bem na borda. A Voyager 1, a sonda mais longe que a humanidade já mandou, só deve começar a entrar nessa região daqui a uns trezentos anos. É o limite do nosso “quintal”."],
[.2,"Estrelas vizinhas","As primeiras estrelas de verdade. Alfa Centauri fica a quatro anos-luz e meio — a luz dela leva mais de quatro anos só pra chegar até nós. Aqui as distâncias estão comprimidas pra gente conseguir ver, mas no espaço real isso é um abismo absurdo."],
[.36,"Braço de Órion","O Sol mora num braço menor da Via Láctea, o Braço de Órion. A gente não está no centro nem na beirada — fica num canto relativamente quieto. E mesmo assim, ao redor, há nuvens de gás, estrelas jovens e poeira que um dia podem virar novos sistemas."],
[.55,"Via Láctea","Agora a gente vê a Via Láctea de verdade. Uma espiral enorme, com centenas de bilhões de estrelas. Tem cerca de cem mil anos-luz de ponta a ponta. O centro brilha com um buraco negro supermassivo. E nós? Estamos a uns vinte e seis mil anos-luz desse centro."],
[.74,"Grupo Local","Saindo da nossa galáxia, chegamos ao Grupo Local. Andrômeda é a maior vizinha, a uns dois milhões e meio de anos-luz daqui, e ela está se aproximando. Daqui a alguns bilhões de anos, as duas galáxias devem se fundir num abraço cósmico lento."],
[.88,"Teia cósmica","Mais longe ainda, a teia cósmica. As galáxias se organizam em filamentos enormes, cercando vazios gigantes onde quase não existe nada. O universo observável tem uns noventa e três bilhões de anos-luz de diâmetro, e a gente mal começou a mapear isso."]];
const MW_INTRO="Vamos sair do Sistema Solar e ir cada vez mais longe. Eu vou te contando o que a gente está vendo pelo caminho.";
const mwEl=i=>document.getElementById(i),hasSpeech=()=>!!(window.speechSynthesis&&window.SpeechSynthesisUtterance);
function buildMW(){
 const wt=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
 const spr=(t,s,o=1)=>{const q=new THREE.Sprite(new THREE.SpriteMaterial({map:t,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:o}));q.scale.set(s,s,1);return q};
 const pts=(pos,col,size,op=1)=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));return new THREE.Points(g,new THREE.PointsMaterial({size,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}))};
 const galaxy=(n,R,arms=2)=>{const cw=[.75,.85,1],cc=[1,.85,.6],p=[],c=[];for(let i=0;i<n;i++){const b=i%5==0,r=b?Math.pow(Math.random(),2)*R*.18:Math.sqrt(Math.random())*R,a=b?Math.random()*6.283:(i%arms)*6.283/arms+r/R*4.5+(Math.random()-.5)*.55*(1-r/R*.5),y=(Math.random()-.5)*R*(b?.12:.02)*(1-r/R*.7);p.push(Math.cos(a)*r,y,Math.sin(a)*r);const k=b?cc:mix(cc,cw,r/R*1.4),f=.5+Math.random()*.5;c.push(k[0]*f,k[1]*f,k[2]*f)}return pts(p,c,1.5,.9)};
 const neb=c=>{const k=document.createElement('canvas');k.width=k.height=128;const x=k.getContext('2d'),im=x.createImageData(128,128);for(let j=0;j<128;j++)for(let i=0;i<128;i++){const f=Math.min(1,Math.max(0,1-Math.hypot(i/64-1,j/64-1))),a=Math.min(1,Math.max(0,(fbm(i/22,j/22,c[3],4)-.25)*2.4))*f*f,o=(j*128+i)*4;im.data[o]=c[0];im.data[o+1]=c[1];im.data[o+2]=c[2];im.data[o+3]=a*200}x.putImageData(im,0,0);return new THREE.CanvasTexture(k)};
 const G=new THREE.Group();G.visible=false;scene.add(G);MW.G=G;
 // nuvem de Oort
 let p=[],c=[];for(let i=0;i<2600;i++){const y=Math.random()*2-1,q=Math.sqrt(1-y*y),t=Math.random()*6.283,r=2000+Math.random()*600;p.push(r*q*Math.cos(t),r*y,r*q*Math.sin(t));c.push(.6,.75,1)}
 MW.oort=pts(p,c,1.3,0);G.add(MW.oort);
 // estrelas vizinhas
 MW.ns=[[0xffe2a0,900,[5200,1500,-6800]],[0xaad4ff,1500,[-9000,2500,-4000]],[0xff6a4a,2600,[12000,-3000,-16000]],[0xcfe0ff,1100,[7000,4000,9500]]].map(([k,z,q])=>{const m=spr(wt,z,0);m.material.color.set(k);m.position.set(...q);G.add(m);return m});
 // a Via Láctea: espiral de 4 braços + brilho do núcleo (Sol a 26 mil anos-luz do centro)
 MW.gal=galaxy(32000,5e4,4);MW.gal.position.copy(GC);MW.gal.material.opacity=0;G.add(MW.gal);
 MW.core=spr(wt,14000,0);MW.core.material.color.set(0xffd9a0);MW.core.position.copy(GC);G.add(MW.core);
 // nuvens de gás ao redor do Sol (Braço de Órion)
 const nt=[[255,90,160,1.3],[80,150,255,4.1],[255,160,60,7.7]].map(neb);MW.neb=[];
 for(let i=0;i<18;i++){const m=spr(nt[i%3],3000+Math.random()*4000,0);m.material.rotation=Math.random()*6;m.position.set((Math.random()-.5)*4.4e4,(Math.random()-.5)*2500,(Math.random()-.5)*4.4e4);G.add(m);MW.neb.push(m)}
 // Grupo Local: Andrômeda e outras galáxias, e a teia cósmica de filamentos
 MW.lg=[];[[3.4e5,6e4,-1.4e5,8e4,.5],[2.6e5,-5e4,2.4e5,3e4,-.7]].concat(Array.from({length:14},()=>[(Math.random()-.5)*8e5,(Math.random()-.5)*2e5,(Math.random()-.5)*8e5,4e3+Math.random()*9e3,Math.random()*3])).forEach(([x,y,z,R,r],i)=>{const g=galaxy(i<2?14000:1500,R,i<2?3:2);g.position.set(x,y,z);g.rotation.set(r,r*2,r/2);g.material.opacity=0;G.add(g);MW.lg.push(g)});
 p=[];c=[];for(let f=0;f<140;f++){let x=(Math.random()-.5)*5e6,y=(Math.random()-.5)*5e6,z=(Math.random()-.5)*5e6;const dv=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize();
  for(let k=0;k<160;k++){dv.add(new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).multiplyScalar(.5)).normalize();x+=dv.x*2.2e4;y+=dv.y*2.2e4;z+=dv.z*2.2e4;
   for(let q=0;q<3;q++){p.push(x+(Math.random()-.5)*2e4,y+(Math.random()-.5)*2e4,z+(Math.random()-.5)*2e4);const w=.5+Math.random()*.5;c.push(.7*w,.8*w,w)}}}
 MW.web=pts(p,c,1.6,0);G.add(MW.web);
 // marcador "você está aqui"
 MW.mark=spr(wt,1,0);MW.mark.material.color.set(0xffeaa8);G.add(MW.mark)}
function mwVoice(){if(MW.vc)return MW.vc;
 const all=speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang)||/portugu/i.test(v.name));if(!all.length)return null;
 const br=all.filter(v=>/pt[-_]BR/i.test(v.lang)||/brasil|brazil/i.test(v.name)),pool=br.length?br:all,
  fem=/maria|francisca|luciana|fernanda|helo[ií]sa|vit[óo]ria|thalita|camila|raquel|female|feminin|google/i,
  mal=/antonio|ant[ôo]nio|daniel|felipe|ricardo|jorge|paulo|male|masculin/i;
 let v=pool.find(q=>mal.test(q.name)&&!fem.test(q.name))||pool.find(q=>!fem.test(q.name));MW.vm=!!v;v=v||pool[0];MW.vc=v;return v}
// narrador estilo dublador: voz masculina, frase a frase, com entonação (empolgação, pergunta, reticências, final dramático)
function mwSay(t){MW.spk=false;if(!MW.voice||!hasSpeech())return;
 try{speechSynthesis.cancel();const id=++MW.sid,v=mwVoice(),base=(MW.vm?0.92:0.62),
   parts=(t.replace(/\s*—\s*/g,', ').match(/[^.!?…]+[.!?…]*/g)||[t]).map(x=>x.trim()).filter(Boolean),
   fim=()=>{if(id===MW.sid)MW.spk=false};MW.spk=true;
  parts.forEach((x,i)=>{const u=new SpeechSynthesisUtterance(x),q=/\?$/.test(x),e=/(enorme|absurd|bilh|gigante|buraco negro|centenas|imens|olha só)/i.test(x),ult=i===parts.length-1,rn=(Math.random()-.5)*.06;
   u.lang='pt-BR';if(v)u.voice=v;u.volume=1;
   u.pitch=Math.max(.1,Math.min(2,base+(i===0?.08:0)+(q?.18:0)+(e?.1:0)-(ult?.06:0)+rn));
   u.rate=Math.max(.5,Math.min(1.5,.78+(e?.03:0)-(/…$/.test(x)?.12:0)-(ult?.1:0)-(q?.03:0)+rn));
   u.onerror=fim;if(ult)u.onend=fim;speechSynthesis.speak(u)});
  setTimeout(fim,3000+t.length*110)}catch(e){MW.spk=false}}
function mwText(i){const q=MWS[i];mwEl('mwt').textContent=q[1];mwEl('mwx').textContent=q[2];clearTimeout(MW.st);
 MW.st=setTimeout(()=>mwSay((i===0?MW_INTRO+' ':'')+q[2]),350)}
function mwStart(){if(MW.on||WK.on)return;if(!MW.built){buildMW();MW.built=true}
 setFocus('sol');
 Object.assign(MW,{on:true,u:0,play:true,b:0,t:0,si:-1,spk:false});
 MW.p0=cam.position.clone();MW.tt0=target.clone();MW.th0=th;MW.ph0=ph;MW.d0=Math.max(600,cam.position.length());
 cam.near=.5;cam.far=1.2e7;cam.updateProjectionMatrix();MW.G.visible=true;
 document.body.classList.add('mw');mwEl('mwp').style.display='block';mwEl('mwpl').textContent='Pausar';mwEl('mwv').textContent=MW.voice?'🔊 Voz':'🔇 Voz';
 if(hasSpeech())try{speechSynthesis.cancel()}catch(e){}}
function mwStop(){if(!MW.on)return;const f=mwEl('fade');f.style.background='#000';f.style.opacity=1;
 setTimeout(()=>{MW.on=false;MW.sid++;MW.spk=false;clearTimeout(MW.st);if(hasSpeech())try{speechSynthesis.cancel()}catch(e){}
  MW.G.visible=false;bgStars.material.opacity=1;cam.near=.1;cam.far=9000;cam.updateProjectionMatrix();
  document.body.classList.remove('mw');mwEl('mwp').style.display='none';mwEl('mwl').style.display='none';
  th=MW.th0;ph=MW.ph0;dist=tDist=solD();target.set(0,0,0);needPrev=true;setFocus('sol');f.style.opacity=0},750)}
function mwUpd(dt){const M=MW;M.t+=dt;
 let si=0;MWS.forEach((q,i)=>{if(M.u>=q[0])si=i});if(si!==M.si){M.si=si;mwText(si)}
 if(M.play){const rate=dt/((M.voice&&hasSpeech())?340:600),nx=MWS[M.si+1],cap=nx?nx[0]-1e-4:1;
  M.u=(M.spk&&M.voice)?Math.min(M.u+rate,Math.max(M.u,cap)):Math.min(1,M.u+rate)}
 const u=M.u,u0=Math.min(1,u/.78),e2=Math.max(0,(u-.78)/.22),sl=mwEl('mws');if(document.activeElement!==sl)sl.value=u*1000;
 const d=M.d0*Math.pow(1.6e5/M.d0,u0)*Math.pow(21.9,e2),tg=new THREE.Vector3(0,0,0).lerp(GC,sS(u0,.4,.8)).lerp(LG,sS(u,.8,.95)),
  phh=M.ph0+(.6-M.ph0)*sS(u0,.3,.8)+.4*sS(u,.78,1),thh=M.th0+sS(u0,0,1)*1.1+M.t*.015;
 let px=tg.x+d*Math.sin(phh)*Math.sin(thh),py=tg.y+d*Math.cos(phh),pz=tg.z+d*Math.sin(phh)*Math.cos(thh);
 if(M.b<1){M.b=Math.min(1,M.b+dt*.7);const e=M.b*M.b*(3-2*M.b);px=M.p0.x+(px-M.p0.x)*e;py=M.p0.y+(py-M.p0.y)*e;pz=M.p0.z+(pz-M.p0.z)*e;tg.lerpVectors(M.tt0,tg,e)}
 cam.position.set(px,py,pz);cam.lookAt(tg);
 bgStars.material.opacity=1-sS(u0,.12,.22);
 M.oort.material.opacity=sS(u0,.04,.1)*(1-sS(u0,.32,.42))*.6;
 M.ns.forEach(n=>n.material.opacity=sS(u0,.2,.3)*(1-sS(u0,.5,.6)));
 M.gal.material.opacity=sS(u0,.3,.5)*.9;M.core.material.opacity=sS(u0,.3,.5)*.5;
 M.neb.forEach(n=>n.material.opacity=sS(u0,.3,.45)*(1-sS(u0,.75,.85))*.6);
 M.lg.forEach(n=>n.material.opacity=sS(u,.6,.76)*.9);M.web.material.opacity=sS(u,.78,.92)*.85;
 const ms=sS(u0,.45,.6);M.mark.material.opacity=ms*.9;M.mark.scale.setScalar(Math.max(1,d*.03));
 const lb=mwEl('mwl');tmp.set(0,0,0).project(cam);const on=ms>.3&&tmp.z<1;lb.style.display=on?'block':'none';
 if(on)lb.style.transform=`translate(${(tmp.x*.5+.5)*innerWidth+14}px,${(-tmp.y*.5+.5)*innerHeight-8}px)`}
mwEl('mwb').onclick=mwStart;mwEl('mwe').onclick=mwStop;
mwEl('mwpl').onclick=()=>{MW.play=!MW.play;mwEl('mwpl').textContent=MW.play?'Pausar':'Continuar';if(hasSpeech())try{MW.play?speechSynthesis.resume():speechSynthesis.pause()}catch(e){}};
mwEl('mwv').onclick=()=>{MW.voice=!MW.voice;mwEl('mwv').textContent=MW.voice?'🔊 Voz':'🔇 Voz';if(MW.voice){const q=MWS[Math.max(0,MW.si)];mwSay(q[2])}else{MW.sid++;MW.spk=false;if(hasSpeech())try{speechSynthesis.cancel()}catch(e){}}};

const clk=new THREE.Clock(),lb={mercurio:document.getElementById('l-mercurio'),venus:document.getElementById('l-venus')};
(function loop(){requestAnimationFrame(loop);if(WK.on){WK.tick();return}
 const dt=Math.min(clk.getDelta(),.1),sp=+document.getElementById('spd').value;
 all.forEach(p=>{p.ang+=dt*sp*(6.2832/p.per)*6;p.pivot.rotation.y=-p.ang;p.mesh.rotation.y+=p.spin*sp*dt});
 if(P.terra.clouds)P.terra.clouds.rotation.y=P.terra.mesh.rotation.y*1.03;
 sun.rotation.y+=dt*.02;belt.rotation.y+=dt*sp*.01;P.terra.mnP.rotation.y+=dt*sp*.9;ven.cl.rotation.y-=dt*sp*.08;merc.pv.rotation.y+=dt*sp*1.4;ven.pv.rotation.y+=dt*sp*.9;
 if(P[focus])P[focus].hold.getWorldPosition(tgt);else tgt.set(0,0,0);
 if(needPrev){prevTgt.copy(tgt);needPrev=false}
 mv.copy(tgt).sub(prevTgt);prevTgt.copy(tgt);target.add(mv);
 const kk=1-Math.exp(-dt*3.2);target.lerp(tgt,kk);dist+=(tDist-dist)*(1-Math.exp(-dt*3));
 if(auto){let dth=thT-th;dth=Math.atan2(Math.sin(dth),Math.cos(dth));th+=dth*kk;ph+=(phT-ph)*kk;if(Math.abs(dth)<.003&&Math.abs(phT-ph)<.003)auto=false}
 cam.position.set(target.x+dist*Math.sin(ph)*Math.sin(th),target.y+dist*Math.cos(ph),target.z+dist*Math.sin(ph)*Math.cos(th));
 cam.lookAt(target);if(MW.on)mwUpd(dt);
 [merc,ven].forEach(p=>{p.hold.getWorldPosition(tmp);const d=cam.position.distanceTo(tmp);p.proxy.scale.setScalar(Math.max(p.rad*1.3,d*.025));
  const l=lb[p.id];tmp.project(cam);const far=d>60&&tmp.z<1;l.style.display=far?'block':'none';
  if(far)l.style.transform=`translate(${(tmp.x*.5+.5)*innerWidth+12}px,${(-tmp.y*.5+.5)*innerHeight-8}px)`});

 skyBand.position.copy(cam.position);skyBand.material.opacity=bgStars.material.opacity*.9;
 R.render(scene,cam)})();
